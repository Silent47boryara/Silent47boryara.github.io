<style>
  :root {
    --bg: #1c140c;
    --bg2: #241a10;
    --card: #faf5ec;
    --border: #e3d5bd;
    --text: #2a2118;
    --muted: #7a6c58;
    --accent: #c9822c;
    --accent-dark: #8a5a2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% -10%, rgba(201,130,44,0.35), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(138,90,43,0.30), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.6rem 2.4rem;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.55);
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    margin-bottom: 1.6rem;
  }
  .brand img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }
  .wordmark { line-height: 1.1; text-align: left; margin: 0; font-weight: normal; }
  .wordmark .k1 { display: block; font-size: 1.2rem; font-weight: 800; color: var(--text); }
  .wordmark .k2 { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; color: var(--accent); }
  h1 { font-size: 1.3rem; margin: 0 0 0.8rem 0; color: var(--text); }
  p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.6rem 0; }
  .btn {
    display: inline-block;
    padding: 0.75rem 1.6rem;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .btn:hover { background: var(--accent-dark); }
  .fallback { margin-top: 1.4rem; font-size: 0.8rem; }
  .fallback a { color: var(--accent-dark); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="og-image.png" alt="Karaptic Research">
      <div class="wordmark">
        <span class="k1">KARAPTIC</span>
        <span class="k2">RESEARCH</span>
      </div>
    </div>
    <h1>This site has moved</h1>
    <p>Karaptic Research now lives at <strong>karaptic.com</strong>. You'll be redirected automatically in a few seconds.</p>
    <a class="btn" href="https://karaptic.com/">Go to karaptic.com →</a>
    <div class="fallback">Not redirected? <a href="https://karaptic.com/">Click here</a>.</div>
  </div>
</body>
</html>
